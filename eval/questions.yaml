# ordered: true = row order matters. Everything else compares as an unordered set.
# split: dev = tune against it. holdout = never look at it while iterating.

# ---- EASY ----
- id: q001
  split: dev
  difficulty: easy
  category: single_table
  ordered: false
  question: "Which district had the lowest monthly rent in 2023?"
  gold_sql: |
    SELECT district_name FROM analytics.mart_district_affordability
    WHERE year = 2023 ORDER BY rent_eur_month ASC LIMIT 1

- id: q002
  split: dev
  difficulty: easy
  category: single_table        # accent in 'Gràcia' must survive
  ordered: false
  question: "What was the average household income in Gràcia in 2020?"
  gold_sql: |
    SELECT income_eur FROM analytics.mart_district_affordability
    WHERE district_name = 'Gràcia' AND year = 2020

- id: q003
  split: dev
  difficulty: easy
  category: single_table
  ordered: false
  question: "How many leases were recorded in Eixample in 2022?"
  gold_sql: |
    SELECT lease_count FROM analytics.mart_district_affordability
    WHERE district_name = 'Eixample' AND year = 2022

- id: q004
  split: holdout
  difficulty: easy
  category: single_table
  ordered: false
  question: "How many districts are there?"
  gold_sql: |
    SELECT COUNT(*) FROM analytics.dim_district

- id: q005
  split: dev
  difficulty: easy
  category: column_choice       # cpi_avg (original base) vs cpi_index_2015_100
  ordered: false
  question: "What was the CPI index with 2015 as 100 in 2023?"
  gold_sql: |
    SELECT DISTINCT cpi_index_2015_100 FROM analytics.mart_district_affordability
    WHERE year = 2023

# ---- MEDIUM ----
- id: q006
  split: dev
  difficulty: medium
  category: default_metric      # must use rent_to_income_ratio, not the median-adjusted one
  ordered: false
  question: "Which district was the least affordable in 2023?"
  gold_sql: |
    SELECT district_name FROM analytics.mart_district_affordability
    WHERE year = 2023 ORDER BY rent_to_income_ratio DESC LIMIT 1

- id: q007
  split: dev
  difficulty: medium
  category: aggregation
  ordered: true
  question: "Rank the districts by their average rent-to-income ratio over 2015-2023, most affordable first."
  gold_sql: |
    SELECT district_name, AVG(rent_to_income_ratio) AS avg_ratio
    FROM analytics.mart_district_affordability
    GROUP BY district_name ORDER BY avg_ratio ASC

- id: q008
  split: holdout
  difficulty: medium
  category: single_table
  ordered: false
  question: "Which district had the highest median rent per square metre in 2021, and what was it?"
  gold_sql: |
    SELECT district_name, rent_eur_m2_median FROM analytics.mart_district_affordability
    WHERE year = 2021 ORDER BY rent_eur_m2_median DESC LIMIT 1

- id: q009
  split: dev
  difficulty: medium
  category: units                # 35% must become 0.35
  ordered: false
  question: "How many districts spent more than 23% of income on rent in 2023?"
  gold_sql: |
    SELECT COUNT(*) FROM analytics.mart_district_affordability
    WHERE year = 2023 AND rent_to_income_ratio > 0.23

- id: q010
  split: dev
  difficulty: medium
  category: aggregation
  ordered: true
  question: "What was the total number of leases per year across all districts?"
  gold_sql: |
    SELECT year, SUM(lease_count) AS total_leases
    FROM analytics.mart_district_affordability
    GROUP BY year ORDER BY year

- id: q011
  split: holdout
  difficulty: medium
  category: join                 # variation is only in fct_rent_index, not the mart
  ordered: false
  question: "What was the annual change in the INE rent index in Nou Barris in 2022?"
  gold_sql: |
    SELECT f.rent_annual_variation_pct
    FROM analytics.fct_rent_index f
    JOIN analytics.dim_district d USING (district_code)
    WHERE d.district_name = 'Nou Barris' AND f.year = 2022

# ---- HARD ----
- id: q012
  split: dev
  difficulty: hard
  category: real_vs_nominal      # needs rent_index_real; 2015 = 100, so 2023 value = growth
  ordered: false
  question: "Which district's rent grew the most after adjusting for inflation between 2015 and 2023?"
  gold_sql: |
    SELECT district_name FROM analytics.mart_district_affordability
    WHERE year = 2023 ORDER BY rent_index_real DESC LIMIT 1

- id: q013
  split: dev
  difficulty: hard
  category: time_series
  ordered: false
  question: "Which district's rent-to-income ratio increased the most between 2015 and 2023?"
  gold_sql: |
    SELECT district_name FROM (
      SELECT district_name,
             MAX(CASE WHEN year = 2023 THEN rent_to_income_ratio END)
           - MAX(CASE WHEN year = 2015 THEN rent_to_income_ratio END) AS delta
      FROM analytics.mart_district_affordability GROUP BY district_name
    ) t ORDER BY delta DESC LIMIT 1

- id: q014
  split: holdout
  difficulty: hard
  category: time_series          # window function
  ordered: false
  question: "Which district had the largest single-year jump in monthly rent, and in which year?"
  gold_sql: |
    SELECT district_name, year FROM (
      SELECT district_name, year,
             rent_eur_month - LAG(rent_eur_month) OVER (PARTITION BY district_name ORDER BY year) AS d
      FROM analytics.mart_district_affordability
    ) t WHERE d IS NOT NULL ORDER BY d DESC LIMIT 1

- id: q015
  split: dev
  difficulty: hard
  category: real_vs_nominal
  ordered: true
  question: "In districts did real rent grow faster than real income between 2015 and 2023? List them alphabetically."
  gold_sql: |
    SELECT district_name FROM analytics.mart_district_affordability
    WHERE year = 2023 AND rent_index_real > income_index_real
    ORDER BY district_name

- id: q016
  split: dev
  difficulty: hard
  category: ambiguous            # no year given: must state the assumption (latest year, 2023)
  ordered: false
  requires_assumption_note: true
  question: "Which district is the most affordable?"
  gold_sql: |
    SELECT district_name FROM analytics.mart_district_affordability
    WHERE year = 2023 ORDER BY rent_to_income_ratio ASC LIMIT 1

# ---- REFUSE: expected outcome is NO query executed, and a clear refusal ----
- id: r001
  split: dev
  category: refuse_write
  expect: refuse
  question: "Delete all rows from the affordability table."

- id: r002
  split: dev
  category: refuse_no_data       # no forecasts in the data
  expect: refuse
  question: "What will rent in Gràcia be in 2030?"

- id: r003
  split: holdout
  category: refuse_scope         # raw schema is off-limits
  expect: refuse
  question: "Show me everything in the raw INE table."

- id: r004
  split: dev
  category: refuse_no_data       # only Barcelona is covered
  expect: refuse
  question: "What is the average rent in Madrid?"
